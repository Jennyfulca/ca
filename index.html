const AVOID = {

  '己':{zh:'生冷瓜果与暴饮暴食偏伤脾：冰饮、生鱼片、大量寒性水果，及饥饱无常、吃得过撑，皆损脾阳、滞碍运化。宜定时定量、温软易消化，细嚼慢咽，忌边食边饮大量水。',en:'cold fruits, overeating (harms Spleen)'},
  '丙':{zh:'生冷寒凉与冰饮须避：冰镇食品、生凉瓜果、久处低温环境易伤肾阳、凝滞气血。宜温食暖身，寒冬尤当护腰足、少涉水受寒，出汗后及时擦干避风。',en:'cold-raw, iced drinks (damages Yang)'},

  '戊':{zh:'辛辣、酒与温燥之物助火：辣椒、烈酒、花椒八角、烧烤煎炸易引心火上炎。宜清淡微苦、清凉润燥，忌烦躁暴怒、烈酒咖啡，午后少浓茶。',en:'acrid, alcohol, warming-dry (fuels fire)'},
  '癸':{zh:'生冷与过度清凉伤心阳：冰饮、寒凉药食、久处空调冷环境易致心阳不振。宜温通心阳、适度辛温，避风口与骤冷，睡前热水泡脚助阳入阴。',en:'cold-raw, over-cooling (harms Yang)'},
  '庚':{zh:'辛辣、酒与燥热伤津：辣椒烈酒、煎炸烘焙、过咸皆耗伤肺津胃液。宜润燥为先，多饮温水，常食白色润肺之品，居室勿过燥热。',en:'acrid, alcohol, dry-heat (harms fluid)'},
  '乙':{zh:'风寒、过汗与耗散伤肺卫：当风直吹、大汗淋漓、过度发汗与劳累皆令卫外不固。宜避风寒、适度收敛、微汗即止，换季与流感季尤护颈背，汗后避风。',en:'wind-cold, excess sweat, dispersion (harms defense)'},
  '壬':{zh:'暴怒与过酸收涩助肝克脾：大怒伤肝、过食酸涩壅滞气机。宜舒肝解郁、少怒多宽，常食黄色健脾食物以防肝木乘土，情志舒畅胜服药。',en:'rage, excessive sour-astringent (feeds Liver overpowering Spleen)'},

const AVOID_QI = {
  taiyang:{zh:'寒水司天之年，保暖避寒为要：腰足、颈背尤当护暖，忌冷饮冰品、冒雨涉水、久居寒湿之地；冬日可温敷护阳（温灸须由专业人员操作）、足下常暖，汗出当风尤忌。',en:'keep warm, avoid cold (protect waist/feet)'},
  taiyin:{zh:'湿土司天之年，甜腻助湿、居处须防潮：少甜腻厚味，梅雨潮湿季防霉除湿，忌贪凉卧地、久处地下室。宜健脾祛湿、衣着透气，勿久穿未干之衣。',en:'sweet-greasy that aids damp, avoid damp lodging'},
  shaoyin:{zh:'君火司天之年，辛辣温燥与熬夜宜忌：易引心火上炎、口疮失眠。宜静心午休、咸寒清热，远烈酒与烦躁动怒，夏秋尤防心系浮火。',en:'acrid warming-dry, staying up late'},
  shaoyang:{zh:'相火司天之年，辛辣酒类与温补过当易生燥火：宜酸凉敛火、多饮水，忌烧烤煎炸与情绪亢奋，春夏季防肝阳上扰。',en:'acrid alcohol, avoid dry-heat flare-up'},
  yangming:{zh:'燥金司天之年，辛辣油炸与过度发汗易耗津液：宜润燥养肺、白色食物、多饮温水，忌久曝干燥环境与久咳伤肺，秋燥时节尤当护津。',en:'acrid fried, do not drain body fluid'},
  jueyin:{zh:'风木司天之年，郁怒与当风受凉须防：大怒引动内风，直吹冷风易袭肝筋目。宜舒肝息风、避大风，调畅情志，春风起时尤当护头颈。',en:'anger and exposure to wind'}
};
/* HUA_NUM（运气生成数·河图数：风3/8 热2/7 雨5/10 清4/9 寒1/6）当前未参与计算，保留为参考资料 */
const YUN_WU={甲:'土',己:'土',乙:'金',庚:'金',丙:'水',辛:'水',丁:'木',壬:'木',戊:'火',癸:'火'};
const SI_WU={jueyin:'木',shaoyin:'火',taiyin:'土',shaoyang:'火',yangming:'金',taiyang:'水'};
const ZQ_WU={jueyin:'木',shaoyin:'火',taiyin:'土',shaoyang:'火',yangming:'金',taiyang:'水'};
/* 岁会判定：岁运五行须与「本宫年支」同——木运临卯、火运临午、金运临酉、水运临子、土运临四季(辰戌丑未)。仅按五行相等会把寅/巳/申/亥误判为岁会。 */
const SUI_HUI={'木':['卯'],'火':['午'],'土':['辰','戌','丑','未'],'金':['酉'],'水':['子']};
const isYang = g => '甲丙戊庚壬'.includes(g);

const GAN=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const ZHI=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const GAN_PY=['Jia','Yi','Bing','Ding','Wu','Ji','Geng','Xin','Ren','Gui'];
const ZHI_PY=['Zi','Chou','Yin','Mao','Chen','Si','Wu','Wei','Shen','You','Xu','Hai'];

let curLang = 'zh';
const APP_VER = 'v2.1';
const T = o => (typeof o==='string'? o : o[curLang]);
function esc(s){return (s==null?'':(''+s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let lastBorn=null, lastGz=null, lastBornObj=null;

/* 下拉初始化已移至脚本末尾（避免 const 暂时性死区） */
function fillDays(){
  const m=+document.getElementById('m').value, y=+document.getElementById('y').value;
  const max=m===2?(y%4===0&&y%100!==0||y%400===0?29:28):[4,6,9,11].includes(m)?30:31;
  const d=document.getElementById('d'); const old=+d.value;
  d.innerHTML='';
  for(let i=1;i<=max;i++){d.add(new Option(i+(curLang==='zh'?'日':''), i));}
  d.value=Math.min(old,max);
}
function getGanZhi(year,month,day){
  let y=year;
  if(month<2||(month===2&&day<4)) y=year-1;
  let g=(y-4)%10; if(g<0)g+=10;
  let z=(y-4)%12; if(z<0)z+=12;
  return GAN[g]+ZHI[z];
}
function gzLabel(gz){
  const gi=GAN.indexOf(gz[0]), zi=ZHI.indexOf(gz[1]);
  return curLang==='zh' ? gz : (GAN_PY[gi]+'-'+ZHI_PY[zi]);
}

/* ===== 十二时辰 ===== */
const SHI=[
  {zh:'子时',en:'Zi (23:00–01:00)'},{zh:'丑时',en:'Chou (01:00–03:00)'},
  {zh:'寅时',en:'Yin (03:00–05:00)'},{zh:'卯时',en:'Mao (05:00–07:00)'},
  {zh:'辰时',en:'Chen (07:00–09:00)'},{zh:'巳时',en:'Si (09:00–11:00)'},
  {zh:'午时',en:'Wu (11:00–13:00)'},{zh:'未时',en:'Wei (13:00–15:00)'},
  {zh:'申时',en:'Shen (15:00–17:00)'},{zh:'酉时',en:'You (17:00–19:00)'},
  {zh:'戌时',en:'Xu (19:00–21:00)'},{zh:'亥时',en:'Hai (21:00–23:00)'}
];
/* 综合体质结论 */
function computeSum(gz){
  const gan=gz[0], zhi=gz[1];
  const yun=YUN[gan], qi=QI[zhi];
  let sum, sumTags;
  if(yun.lv.zh==='太过'){
    sum = curLang==='zh'
      ? `先天以「${yun.e.zh}运太过」为主导：本脏（${yun.e.zh}）气偏盛，而易抑 ${SUPP[gan].zh}；又值「${T(SI_NAME[qi.stKey])}」之年，${qi.d.zh} 综合来看，您先天偏向「${yun.e.zh}旺而${SUPP[gan].zh}弱、兼${qiKeyWord(qi.stKey)}」之体。`
      : `Inborn constitution is led by "${yun.e.en} Movement in Excess": this element (${yun.e.en}) is predominant, while ${SUPP[gan].en} is suppressed; born in a "${T(SI_NAME[qi.stKey])}" year, ${qi.d.en} Overall you tend toward "${yun.e.en} exuberant and ${SUPP[gan].en} weak, with ${qiKeyWord(qi.stKey)}".`;
    sumTags = curLang==='zh' ? [yun.e.zh+'运太过', SUPP[gan].zh+'偏弱', T(SI_NAME[qi.stKey])] : [yun.e.en+' '+yun.lv.en, SUPP[gan].en+' weak', T(SI_NAME[qi.stKey])];
  }else{
    sum = curLang==='zh'
      ? `先天以「${yun.e.zh}运不及」为主导：本脏（${yun.e.zh}，弱脏为${WEAK[gan].zh}）禀赋偏弱；又值「${T(SI_NAME[qi.stKey])}」之年，${qi.d.zh} 综合来看，您先天偏向「${WEAK[gan].zh}弱、兼${qiKeyWord(qi.stKey)}」之体，宜早养防偏。`
      : `Inborn constitution is led by "${yun.e.en} Movement in Deficiency": this element (${yun.e.en}, weak organ ${WEAK[gan].en}) is inherently insufficient; born in a "${T(SI_NAME[qi.stKey])}" year, ${qi.d.en} Overall you tend toward "${WEAK[gan].en} weak, with ${qiKeyWord(qi.stKey)}" — best to nourish early and prevent deviation.`;
    sumTags = curLang==='zh' ? [yun.e.zh+'运不及', WEAK[gan].zh+'偏弱', T(SI_NAME[qi.stKey])] : [yun.e.en+' '+yun.lv.en, WEAK[gan].en+' weak', T(SI_NAME[qi.stKey])];
  }
  return {sum, sumTags};
}
function qiKeyWord(stKey){
  const m={jueyin:'风',shaoyin:'热',taiyin:'湿',shaoyang:'火',yangming:'燥',taiyang:'寒'};
  const me={jueyin:'wind',shaoyin:'heat',taiyin:'damp',shaoyang:'fire',yangming:'dryness',taiyang:'cold'};
  return curLang==='zh'?m[stKey]:me[stKey];
}


/* 弱项与需注意 */
function computeWeak(gz){
  const gan=gz[0], zhi=gz[1];
  const yun=YUN[gan], qi=QI[zhi];
  const isDef=yun.lv.zh==='不及';
  const wk=isDef?WEAK[gan]:SUPP[gan];
  const zhiName=T(SI_NAME[qi.stKey]);
  let weakTitle, weakText;
  if(isDef){
    weakTitle = curLang==='zh' ? wk.zh+'偏弱（不及之年）' : wk.en+' weak (Deficient year)';
    weakText = curLang==='zh'
      ? `先天「${yun.e.zh}运不及」，本脏（${yun.e.zh}）禀赋偏弱，弱脏在<b>${wk.zh}</b>。常见：${yun.s.zh} 又值「${zhiName}」之年，${qi.d.zh} 故<b>${wk.zh}</b>更当早养、防微杜渐。`
      : `Inborn "${yun.e.en} Movement in Deficiency": this element is inherently insufficient; the vulnerable organ is the <b>${wk.en}</b>. Common signs: ${yun.s.en} Born in a "${zhiName}" year, ${qi.d.en} — so the <b>${wk.en}</b> should be nourished early to prevent deviation.`;
  }else{
    weakTitle = curLang==='zh' ? wk.zh+'受抑偏弱（太过之年）' : wk.en+' suppressed (Excess year)';
    weakText = curLang==='zh'
      ? `先天「${yun.e.zh}运太过」，本脏偏亢，易乘克而抑<b>${wk.zh}</b>（${wk.zh}受抑偏弱）。常见：${yun.s.zh} 又值「${zhiName}」之年，${qi.d.zh} 故<b>${wk.zh}</b>宜护、勿令过伤。`
      : `Inborn "${yun.e.en} Movement in Excess": the element is hyperactive and easily suppresses the <b>${wk.en}</b> (which becomes the weak link). Common signs: ${yun.s.en} Born in a "${zhiName}" year, ${qi.d.en} — so the <b>${wk.en}</b> should be protected from over-injury.`;
  }
  const tags = curLang==='zh' ? [wk.zh+(isDef?'偏弱':'受抑'), zhiName] : [wk.en+(isDef?' weak':' suppressed'), zhiName];
  return {weakTitle, weakText, tags, organ:wk};
}

/* 先天体质标签：五运主导 + 六气（司天/在泉）叠加 */
function computeLabel(gz){
  const gan=gz[0], zi=QI[gz[1]];
  let zh=YUN_LABEL[gan].zh, en=YUN_LABEL[gan].en;
  const mz=[QI_MOD[zi.stKey].zh, QI_MOD[zi.zqKey].zh].filter((m,i,a)=>a.indexOf(m)===i);
  for(const m of mz){ const w=m.replace('兼',''); if(!zh.includes(w)) zh=zh+m; }
  const me=[QI_MOD[zi.stKey].en, QI_MOD[zi.zqKey].en].filter((m,i,a)=>a.indexOf(m)===i);
  for(const m of me){ const w=m.replace('with ','').toLowerCase(); if(!en.toLowerCase().includes(w)) en=en+' '+m; }
  return {zh,en};
}

/* 特殊年份：天符 / 岁会 / 同天符 / 同岁会 / 太乙天符 */
function specialYear(gz){
  const gan=gz[0], zhi=gz[1];
  const stKey=QI[zhi].stKey, zqKey=QI[zhi].zqKey;
  const yw=YUN_WU[gan], sw=SI_WU[stKey], zw=ZQ_WU[zqKey];
  const yang=isYang(gan);
  /* 岁会：须岁运五行与本宫年支对应（见 SUI_HUI），而非仅五行相等 */
  const tf = yw===sw, sh = !!(SUI_HUI[yw] && SUI_HUI[yw].includes(zhi));
  const b=[];
  if(tf) b.push(curLang==='zh'?'天符年':'Tian-Fu year');
  if(sh) b.push(curLang==='zh'?'岁会年':'Sui-Hui year');
  /* 同天符：岁运（阳年/太过）与「在泉」之气同气；同岁会：岁运（阴年/不及）与「在泉」同气 */
  if(yw===zw && yang) b.push(curLang==='zh'?'同天符':'Tong-Tian-Fu');
  if(yw===zw && !yang) b.push(curLang==='zh'?'同岁会':'Tong-Sui-Hui');
  if(tf && sh) b.push(curLang==='zh'?'太乙天符':'Tai-Yi Tian-Fu');
  return b;
}

/* 先天体质 */
function judge(){
  const y=+document.getElementById('y').value, m=+document.getElementById('m').value, d=+document.getElementById('d').value, h=+document.getElementById('h').value;
  const name=(document.getElementById('nm').value||'').trim().slice(0,20);
  const gz=getGanZhi(y,m,d);
  lastBorn={y,m,d,h,name}; lastBornObj={y,m,d,h,name}; lastGz=gz;
  renderResult(gz);
  saveHistory(y,m,d,h,name,gz,YUN[gz[0]].e.zh+' '+YUN[gz[0]].lv.zh,T(SI_NAME[QI[gz[1]].stKey]));
}
function renderResult(gz){
  const y=lastBornObj.y,m=lastBornObj.m,d=lastBornObj.d,h=lastBornObj.h;
  const gan=gz[0], zhi=gz[1];
  const yun=YUN[gan], qi=QI[zhi];
  const U=UI[curLang];

  let yunT = yun.lv.zh==='不及'
      ? yun.t[curLang].replace('_body_', WEAK[gan][curLang])
      : yun.t[curLang].replace('_body_', SUPP[gan][curLang]);

  const sumObj = computeSum(gz);
  const weakObj = computeWeak(gz);

  document.getElementById('gz').textContent=gzLabel(gz);
  const shiName = T(SHI[h]);
  document.getElementById('gzEn').textContent = curLang==='zh'
    ? `出生：${y}年${m}月${d}日 ${shiName} ｜ 干支纪年：${gz}年（以立春约2月4日为界）`
    : `Born: ${y}-${m}-${d} ${shiName} ｜ Stem-Branch year: ${gzLabel(gz)} (Start-of-Spring boundary)`;
  document.getElementById('tags').innerHTML=`<span class="tag">${yun.e[curLang]} ${yun.lv[curLang]}</span><span class="tag">${T(SI_NAME[qi.stKey])}</span>`;
  const labelObj=computeLabel(gz);
  const spR=specialYear(gz);
  let lb=`<div class="lt">${U.labelTitle}</div><div class="ltag">${labelObj[curLang]}</div><div style="font-size:13px;color:var(--muted);margin-top:6px">标签＝五运主导 ＋ 当年六气偏向（司天·在泉分主上下半年）</div>`;
  if(spR.length){ lb+=`<div class="badge">${spR.join('</div><div class="badge">')}</div>`; }
  document.getElementById('labelBox').innerHTML=lb;
  document.getElementById('yunText').textContent=yunT+' '+yun.s[curLang];
  document.getElementById('qiText').textContent=(curLang==='zh'?`本年「${T(SI_NAME[qi.stKey])}司天，${T(SI_NAME[qi.zqKey])}在泉」。`:`This year "${T(SI_NAME[qi.stKey])} supervising heaven, ${T(SI_NAME[qi.zqKey])} at the spring". `)+qi.d[curLang];
  document.getElementById('sumText').textContent=sumObj.sum;
  document.getElementById('sumTags').innerHTML=sumObj.sumTags.map(t=>`<span class="tag">${t}</span>`).join('');
  document.getElementById('weakBox').innerHTML=`<div class="row-title">${weakObj.weakTitle}</div><p>${weakObj.weakText}</p>`;
  document.getElementById('tips').textContent=yun.tips[curLang]+'　'+yearDietFocus(zhi);
  document.getElementById('avoidBox').innerHTML=`<div class="row-title">${U.sec6}</div><p><b style="color:var(--orange)">${curLang==='zh'?'忌：':'Avoid: '}</b>${AVOID[gan][curLang]}；${AVOID_QI[qi.stKey][curLang]}</p>`;
  document.getElementById('note').textContent=U.note;

  document.getElementById('result').style.display='block';
  document.getElementById('result').scrollIntoView({behavior:'smooth'});
}

/* 语言切换 */
function toggleLang(){
  curLang = curLang==='zh' ? 'en' : 'zh';
  const btn=document.getElementById('langBtn'); if(btn) btn.textContent = curLang==='zh' ? 'EN' : '中';
  applyLang();
}
function applyLang(){
  const U=UI[curLang];
  document.documentElement.lang = curLang==='zh' ? 'zh-CN' : 'en';
  ['seal','title','sub','quote','warn','inputLabel','btn','sec1','sec2','sec3','sec4','sec5','sec6','note','histTitle','clear','reportBtn','disc','footer'].forEach(id=>{
    const el=document.getElementById('ui_'+id); if(el) el.innerHTML=U[id];
  });
  document.getElementById('ui_disc').innerHTML=U.disc;
  document.getElementById('btnSave').textContent=U.btnSave;
  document.getElementById('btnCopy').textContent=U.btnCopy;
  document.getElementById('btnShare').textContent=U.btnShare;
  document.getElementById('btnClose').textContent=U.btnClose;
  const y=document.getElementById('y'),m=document.getElementById('m'),d=document.getElementById('d');
  const yv=+y.value, mv=+m.value, dv=+d.value;
  y.innerHTML=''; for(let i=new Date().getFullYear();i>=1920;i--){y.add(new Option(i+(curLang==='zh'?'年':''), i));} y.value=yv;
  m.innerHTML=''; for(let i=1;i<=12;i++){m.add(new Option(i+(curLang==='zh'?'月':''), i));} m.value=mv;
  fillDays(); d.value=dv;

/* 本年饮食侧重：取司天/在泉之食药性味与宜食，融入饮食建议（不另立运气篇幅） */
function yearDietFocus(zhi){
  const qi=QI[zhi];

    : `This year's climate leans toward "${T(SI_NAME[qi.stKey])} · ${T(SI_NAME[qi.zqKey])}"; favor a "${st.wei[L]} · ${zq.wei[L]}" nature, with foods such as ${st.food[L]}, ${zq.food[L]}.`);
}

/* ===== 报告（可转发）===== */
function getReportData(gz){
  const y=lastBornObj.y,m=lastBornObj.m,d=lastBornObj.d;
  const gan=gz[0], zhi=gz[1];
  const yun=YUN[gan], qi=QI[zhi];
  const U=UI[curLang];
  const sumObj=computeSum(gz), weakObj=computeWeak(gz);
  const labelObj=computeLabel(gz);
  const avoidText = AVOID[gan][curLang]+'；'+AVOID_QI[qi.stKey][curLang];
  const isDef = yun.lv.zh==='不及';
  const organ=weakObj.organ[curLang];
  const conclNote = curLang==='zh'
    ? `注解：您出生年属「${yun.e.zh}运${yun.lv.zh}」，意思是${yun.e.zh}这个系统先天${(isDef?'偏弱、更需要养护':'偏旺、容易压制别处')}。这只是倾向，不是定数——饮食作息调得好，完全可以改善。`
    : `Note: your birth year belongs to "${yun.e.en} Movement ${yun.lv.en}", meaning this system is inborn ${(isDef?'weaker and needs more care':'predominant and may suppress others')}. This is only a tendency, not fixed — good diet and habits can improve it.`;
  const weakNote = curLang==='zh'
    ? `注解：最该留意的是「${organ}」。先天偏弱或受抑，平时少熬夜、少过劳，换季与感冒高发时多护着它，有不适早调理。`
    : `Note: pay most attention to the "${organ}". Inborn weak or suppressed — avoid staying up late and overwork, protect it during season changes and cold/flu season, and regulate early if discomfort arises.`;
  const name = (lastBornObj && lastBornObj.name) ? lastBornObj.name : '';
  const safeName = esc(name);
  const birthLine = (curLang==='zh'
      ? `出生：${y}年${m}月${d}日 ${T(SHI[lastBornObj.h])} ｜ 干支纪年：${gz}年（以立春约2月4日为界）`
      : `Born: ${y}-${m}-${d} ${T(SHI[lastBornObj.h])} ｜ Stem-Branch year: ${gzLabel(gz)} (Start-of-Spring boundary)`)
    + (name?` ｜ 客户：${safeName}`:'');
  return {
    clinic:U.seal, title:U.rptTitle, sub:U.rptSub,
    birthLine, name,
    tags:[yun.e[curLang]+' '+yun.lv[curLang], weakObj.tags[0], weakObj.tags[1]],
    labelTitle:U.rLabel, label:labelObj[curLang],
    conclTitle:U.rConcl, concl:sumObj.sum, conclNote,
    weakTitle:U.rWeak, weakText:weakObj.weakText, weakNote,
    careTitle:U.rCare, care:yun.tips[curLang]+'　'+yearDietFocus(zhi),
    avoidTitle:U.rAvoid, avoid:avoidText,
    contactTitle:U.rContact, contact:U.rContactNote,
    disc:U.rDisc
  };
}

/* 生成分享图（离屏 canvas，无需联网/第三方库）*/
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function wrapText(ctx,text,font,maxW){
  ctx.font=font;
  const lines=[]; let line='';
  for(const ch of (text||'')){
    if(ch==='\n'){lines.push(line);line='';continue;}
    const t=line+ch;
    if(ctx.measureText(t).width>maxW){ if(line) lines.push(line); line=ch; }else line=t;
  }
  if(line)lines.push(line);
  return lines;
}
function drawPills(ctx,tags,x,y,maxW,font,fg,bg){
  ctx.font=font;ctx.textBaseline='middle';ctx.textAlign='center';
  let cx=x,cy=y;const padX=18,h=46,gap=14;
  for(const t of tags){const w=ctx.measureText(t).width+padX*2;
    if(cx+w>maxW+2){cx=x;cy+=h+gap;}
    roundRect(ctx,cx,cy,w,h,23);ctx.fillStyle=bg;ctx.fill();
    ctx.fillStyle=fg;ctx.fillText(t,cx+w/2,cy+h/2+1);cx+=w+gap;}
  return cy+h;
}
function saveReport(){
  if(!lastGz){toast('请先辨识体质');return;}
  const _raw=getReportData(lastGz);
  const _strip=s=>(s==null?'':(''+s)).replace(/<[^>]+>/g,'');
  const D={tags:_raw.tags, name:_raw.name};
  for(const k in _raw){ if(k!=='tags' && k!=='name') D[k]=_strip(_raw[k]); }
  const W=750, pad=44, innerW=W-pad*2;
  const F='"PingFang SC","Microsoft YaHei",sans-serif';
  const C={bg:'#F7F2E7',card:'#FFFDF8',green:'#2F5D34',greenD:'#234A28',orange:'#C26A3C',ink:'#33312B',muted:'#6F6657',sand:'#EFE3D0',line:'#E0D2BA'};
  const c=document.createElement('canvas'); const ctx=c.getContext('2d');
  const ops=[]; let y=pad;
  const add=(o)=>ops.push(o);
  // 逐行推进 y：每行单独占位，避免多行文字重叠
  const pushWrap=(type,text,font,maxW,lineH)=>{
    const L=wrapText(ctx,text,font,maxW);
    L.forEach(ln=>{add({t:type,text:ln,y}); y+=lineH;});
  };
  pushWrap('ctitle',D.title,'bold 44px '+F,innerW,60); y+=8;
  pushWrap('csub',D.sub,'24px '+F,innerW,34); y+=8;
  if(D.name){ add({t:'cname',text:D.name,y}); y+=42; }
  add({t:'cline',y}); y+=24;
  pushWrap('cp',D.birthLine,'28px '+F,innerW,42); y+=10;
  add({t:'cpills',tags:D.tags,y}); y+=64;
  pushWrap('clabel',D.label,'bold 34px '+F,innerW,48); y+=8;
  function section(head,body){
    add({t:'ch',text:head,y}); y+=54;
    pushWrap('cp',body,'28px '+F,innerW,42); y+=20;
  }
  section(D.conclTitle,D.concl);
  section(D.weakTitle,D.weakText);
  section(D.careTitle,D.care);
  section(D.avoidTitle,D.avoid);
  const cb=wrapText(ctx,D.contact,'bold 30px '+F,innerW-36);
  const cbH=cb.length*44+52;
  add({t:'cbox',title:D.contactTitle,lines:cb,h:cbH,y}); y+=cbH+20;
  pushWrap('cd',D.disc,'22px '+F,innerW,32); y+=10;
  add({t:'cver',text:'先天体质辨识 · 版本 '+APP_VER,y}); y+=26;
  y+=pad;
  c.width=W; c.height=y;
  ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,y);
  ctx.fillStyle=C.card; roundRect(ctx,pad*0.5,pad*0.5,innerW+pad, y-pad, 20); ctx.fill();
  for(const o of ops){
    if(o.t==='ctitle'){ctx.font='bold 44px '+F;ctx.fillStyle=C.greenD;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.text,W/2,o.y+30);}
    else if(o.t==='csub'){ctx.font='24px '+F;ctx.fillStyle=C.muted;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.text,W/2,o.y+17);}
    else if(o.t==='cname'){ctx.font='bold 26px '+F;ctx.fillStyle=C.orange;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('客户：'+o.text,W/2,o.y+20);}
    else if(o.t==='cline'){ctx.strokeStyle=C.line;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(pad,o.y);ctx.lineTo(W-pad,o.y);ctx.stroke();}
    else if(o.t==='cp'){ctx.font='28px '+F;ctx.fillStyle=C.ink;ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(o.text,pad,o.y);}
    else if(o.t==='ch'){ctx.font='bold 31px '+F;ctx.textBaseline='top';ctx.fillStyle=C.orange;ctx.fillRect(pad,o.y+4,8,30);ctx.fillStyle=C.greenD;ctx.fillText(o.text,pad+18,o.y);}
    else if(o.t==='cpills'){drawPills(ctx,o.tags,pad,o.y,innerW,'26px '+F,C.green,'#EAF0EA');}
    else if(o.t==='clabel'){ctx.font='bold 34px '+F;ctx.fillStyle=C.greenD;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.text,W/2,o.y+24);}
    else if(o.t==='cbox'){ctx.fillStyle='#FBF1E8';roundRect(ctx,pad,o.y,innerW,o.h,14);ctx.fill();
        ctx.strokeStyle=C.orange;ctx.lineWidth=2;roundRect(ctx,pad,o.y,innerW,o.h,14);ctx.stroke();
        ctx.font='bold 27px '+F;ctx.fillStyle=C.greenD;ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(o.title,pad+18,o.y+14);
        ctx.font='bold 30px '+F;ctx.fillStyle=C.orange;o.lines.forEach((ln,i)=>ctx.fillText(ln,pad+18,o.y+50+i*44));}
    else if(o.t==='cd'){ctx.font='22px '+F;ctx.fillStyle=C.muted;ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(o.text,pad,o.y);}
    else if(o.t==='cver'){ctx.font='20px '+F;ctx.fillStyle=C.muted;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.text,W/2,o.y+13);}
  }
  /* 直接下载为 PNG（文件名含客户姓名/编号） */
  try{
    const a=document.createElement('a');
    a.href=c.toDataURL('image/png');
    const fname=(D.name? D.name+'_':'')+'先天体质报告.png';
    a.download=fname; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast('报告图片已保存：'+fname);
  }catch(e){ toast('当前环境不支持保存图片，请改用「复制文字」'); }
}

function copyReport(){

function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>toast(UI[curLang].toastCopy)).catch(()=>fallbackCopy(t));
  }else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.top='0';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,ta.value.length);
  try{document.execCommand('copy');toast(UI[curLang].toastCopy);}catch(e){toast('请长按文字选择复制');}
  document.body.removeChild(ta);
}
function shareReport(){

}

/* Toast */
let _toastTimer=null;

/* 历史 */
function saveHistory(y,m,d,h,name,gz,yun,qi){
  let list=JSON.parse(lsGet('tizhi_his')||'[]');
  list.unshift({y,m,d,h,name,gz,yun,qi}); list=list.slice(0,8);
  lsSet('tizhi_his',JSON.stringify(list)); renderHistory();
}
/* 兼容新旧历史格式：gz 以「庚午」式双字串存储；早期版本 gz 误存为时辰序号、真实干支落在 yun 字段 */
function getHistGz(x){
  const g = x.gz;
  if(typeof g==='string' && g.length>=2 && GAN.includes(g[0]) && ZHI.includes(g[1])) return g;
  if(Array.isArray(g) && g.length===2 && GAN.includes(g[0]) && ZHI.includes(g[1])) return g[0]+g[1];
  if(typeof x.yun==='string' && x.yun.length>=2 && GAN.includes(x.yun[0]) && ZHI.includes(x.yun[1])) return x.yun[0]+x.yun[1];
  return null;
}
function getHistH(x){ return (typeof x.h==='number' && x.h>=0 && x.h<12) ? x.h : 0; }
function renderHistory(){
  const h=JSON.parse(lsGet('tizhi_his')||'[]');
  const box=document.getElementById('historyBox');
  if(!h.length){box.style.display='none';return;}
  box.style.display='block';
  document.getElementById('historyList').innerHTML=h.map((x,i)=>{
    const gz=getHistGz(x), gzStr = gz || '—';
    const hour = (typeof x.h==='number' && x.h>=0 && x.h<12) ? T(SHI[x.h]) : '—';
    const name = (x.name && x.name.trim()) ? x.name.trim() : '';
    const line = `${x.y}年${x.m}月${x.d}日 ${hour} · ${gzStr}年` + (name?` ｜ ${esc(name)}`:'');
    return `<div class="hist-item" onclick="openHistoryReport(${i})"><span class="hist-main">${line}</span><span class="hist-side">${esc(x.yun)}｜${esc(x.qi)}</span><span class="hist-del" onclick="deleteHistory(${i});event.stopPropagation();" title="删除本条">×</span><span class="hist-open">查看▸</span></div>`;
  }).join('');
}
function openHistoryReport(idx){
  const h=JSON.parse(lsGet('tizhi_his')||'[]');
  const x=h[idx]; if(!x){toast('记录不存在');return;}
  const gz=getHistGz(x); if(!gz){toast('该记录数据不完整，请重新辨识后保存');return;}
  const hh=getHistH(x);
  const name=(x.name&&x.name.trim())?x.name.trim():'';
  lastBorn={y:x.y,m:x.m,d:x.d,h:hh,name}; lastBornObj={y:x.y,m:x.m,d:x.d,h:hh,name}; lastGz=gz;
  openReport();
}
function deleteHistory(idx){
  let list=JSON.parse(lsGet('tizhi_his')||'[]');
  if(idx<0||idx>=list.length){return;}
  list.splice(idx,1);
  lsSet('tizhi_his',JSON.stringify(list)); renderHistory();
}
function clearHistory(){lsDel('tizhi_his');renderHistory();}
renderHistory();
